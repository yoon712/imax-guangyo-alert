name: cgv-gwanggyo-imax-alert

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-gwanggyo-imax-alert
  cancel-in-progress: false

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Monitor CGV every minute
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SITE_NO: "0257"
          SITE_NAME: "광교"

          MOVIE_NO: "30001323"
          MOVIE_TITLE: "오디세이"

          SCREEN_KEYWORD: "IMAX"

          START_DATE: "2026-09-01"
          END_DATE: "2026-09-06"

        run: |
          for i in 1 2 3 4
          do

            echo ""
            echo "=========================================="
            echo "CGV 체크 $i / 4"
            echo "=========================================="

            python monitor_cgv.py

            if [ "$i" -lt 4 ]; then
              echo ""
              echo "60초 후 다시 확인합니다."
              sleep 60
            fi

          done

      - name: Save monitor state
        run: |

          if [[ -n "$(git status --porcelain .cache/last_state.json)" ]]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add .cache/last_state.json

            git commit \
              -m "Update CGV IMAX monitor state" \
              || exit 0

            git push

          else

            echo "No state changes."

          fi
