name: cgv-gwanggyo-imax-alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_URL: "https://cgv.co.kr/cnm/movieBook/cinema?siteNm=%EA%B4%91%EA%B5%90&siteNo=0257"
          MOVIE_TITLE: "오디세이"
          THEATER_KEYWORD: "광교"
          SCREEN_KEYWORD: "IMAX"
          START_DATE: "2026-08-31"
          LOOKAHEAD_DAYS: "14"
        run: python monitor_cgv.py

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain .cache)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .cache
            git commit -m "Update CGV monitor state" || exit 0
            git push
          fi
